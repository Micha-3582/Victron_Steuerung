<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konto anlegen · {{ app_display_name }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <meta name="theme-color" content="#1c2027">
  <style>
    :root {
      --bg: #14171c; --card: #1c2027; --card2: #232833;
      --fg: #e6e9ef; --muted: #8d96a8; --accent: #4da3ff; --border: #2e3542;
      --red: #e5544a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 28px 26px; width: 100%; max-width: 380px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .brand .sun { font-size: 26px; }
    .brand h1 { font-size: 18px; margin: 0; font-weight: 600; }
    .intro { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 15px; }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 42px; }
    .pw-toggle { position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      background: none; border: none; margin: 0; width: 34px; height: 34px; padding: 0;
      display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; }
    .pw-toggle:hover { color: var(--fg); }
    .pw-toggle svg { width: 20px; height: 20px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    button { width: 100%; margin-top: 18px; cursor: pointer; border: none; border-radius: 10px;
      padding: 12px 16px; font-size: 15px; font-weight: 600; background: var(--accent); color: #14171c; }
    .error { background: rgba(229,84,74,.12); border: 1px solid rgba(229,84,74,.3);
      color: var(--red); padding: 10px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 4px; }
  </style>
</head>
<body>
  <form class="card" method="post" autocomplete="on">
    <div class="brand">
      <span class="sun">🔆</span>
      <h1>{{ app_display_name }}</h1>
    </div>
    <p class="intro">Erststart: Zugang für diese App anlegen. Nur dieses eine Mal – danach
    normal anmelden.</p>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <label>Benutzername</label>
    <input type="text" name="username" autocomplete="username"
           autocapitalize="off" spellcheck="false" required autofocus>

    <label>Passwort</label>
    <div class="pw-wrap">
      <input type="password" id="pw" name="password" autocomplete="new-password" minlength="8" required>
      <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Passwort anzeigen" title="Passwort anzeigen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="hint">Mindestens 8 Zeichen.</div>

    <label>Passwort wiederholen</label>
    <input type="password" name="password2" autocomplete="new-password" minlength="8" required>

    <button type="submit">Konto anlegen</button>
  </form>
  <script>
    document.getElementById('pw-toggle').addEventListener('click', function () {
      var pw = document.getElementById('pw');
      var showing = pw.type === 'text';
      pw.type = showing ? 'password' : 'text';
      this.setAttribute('aria-label', showing ? 'Passwort anzeigen' : 'Passwort verbergen');
      this.title = showing ? 'Passwort anzeigen' : 'Passwort verbergen';
    });
  </script>
</body>
</html>
